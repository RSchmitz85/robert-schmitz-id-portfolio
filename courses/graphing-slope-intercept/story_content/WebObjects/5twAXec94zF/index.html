<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scribble’s Graphing Practice Set</title><style>*{box-sizing:border-box}body{margin:0;background:#142b35;color:#fff0cc;font-family:Georgia,serif}header{padding:18px 28px;background:#06254b;border-bottom:2px solid #a97932;display:flex;gap:20px;align-items:center;justify-content:space-between}h1{font-size:24px;margin:0}header p{font:14px Arial,sans-serif;margin:0}nav{display:flex;justify-content:center;gap:10px;padding:12px;flex-wrap:wrap}a{display:flex;gap:10px;align-items:center;padding:10px 16px;border:1px solid #a97932;border-radius:6px;color:#fff0cc;text-decoration:none;font:14px Arial,sans-serif;background:#06254b}a:hover,a:focus-visible,a[aria-current=true]{background:#17575b;outline:2px solid #c8a25c;outline-offset:2px}a span{color:#edc478}iframe{display:block;width:100%;height:calc(100vh - 140px);min-height:500px;border:0;background:#142b35}@media(max-width:600px){header{display:block;padding:16px}h1{font-size:22px}header p{margin-top:8px}nav{gap:8px}a{padding:8px;font-size:12px}iframe{height:100vh;min-height:900px}}html,body{height:100%;overflow:hidden}body{display:flex;flex-direction:column}nav{flex:none;padding:8px;gap:8px}nav a{padding:8px 12px;font-size:14px}iframe{flex:1;min-height:0;height:0}@media(max-width:600px){nav{padding:5px;gap:4px}nav a{padding:6px;font-size:12px}iframe{height:0;min-height:0}}</style></head><body><nav aria-label="Choose a practice graph"><a href="01-positive/" target="activity" data-title="Scribble’s Graphing Lookout"><span>01</span><strong>Positive slope</strong></a><a href="02-negative/" target="activity" data-title="Scribble’s Canyon Survey"><span>02</span><strong>Negative slope</strong></a><a href="03-fractional/" target="activity" data-title="Scribble’s Slope Observatory"><span>03</span><strong>Fractional slope</strong></a><a href="04-zero/" target="activity" data-title="Scribble’s Harbor Chart Room"><span>04</span><strong>Zero slope</strong></a><a href="05-steep/" target="activity" data-title="Scribble’s Mountain Base Camp"><span>05</span><strong>Steep positive slope</strong></a></nav><iframe name="activity" title="Scribble’s Graphing Lookout" src="01-positive/"></iframe><script>const links=[...document.querySelectorAll('nav a')];links[0].setAttribute('aria-current','true');links.forEach(a=>a.addEventListener('click',()=>{links.forEach(x=>x.removeAttribute('aria-current'));a.setAttribute('aria-current','true');document.querySelector('iframe').title=a.dataset.title}));</script></body></html>
